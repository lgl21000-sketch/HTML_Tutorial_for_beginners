<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>张三的个人技术博客</title>
        <style>
            header{background-color: #f4f4f4; border-bottom: 2px solid #ccc; padding: 15px; margin-bottom: 20px}
            header a{text-decoration: none; color: #0066cc; font-weight: bold}
            .asideclass{width: 250px; background-color: #eef6ff; padding: 10px; border: 1px dashed #99ccff}
            aside li{color: #555555; font-size: 14px;}
            #articleheading1{font-size: 24px; color: #333333; text-align: center}
            #skills-table{text-decoration: line-through}
            table{border-collapse: collapse; border: 3px solid black; margin-top: 15px;}
            table tr th{padding: 8px; border: 1px solid #ddd}
            table tr td{padding: 8px; border: 1px solid #ddd}
            .displaytest{display: none}
        </style>        
    </head>
    <body>
        <header>
            Welcome!
            <nav>
                <a href="https://example.com/home">首页</a>
                <a href="#skills-table">跳转到表格</a>
            </nav>
        </header>
        <aside class="asideclass">
            <ul>
                <li>HTML5 语义化标签指南</li>
                <li>CSS Flexbox 布局入门</li>
            </ul>
        </aside>
        <main>
            <article>
                <h1 id="articleheading1">
                    我的 Web 前端学习笔记
                </h1>
                <p>
                    欢迎来到我的博客！今天是我学习 HTML5 的第一天，掌握了许多非常有用的标签。
                </p>
                <img src="https://via.placeholder.com/150" alt="学习笔记封面图"/>
                <h2>
                    今天学习的 3 个核心知识点
                </h2>
                <ol>
                    <li>理解网页的语义化结构</li>
                    <li>掌握 a 标签的锚点跳转</li>
                    <li>学会使用 table 绘制数据表格</li>
                </ol>
                <h2 id="skills-table">
                    我的技能熟练度
                </h2>                
                <table>
                    <tr>
                        <th>技能</th>
                        <th>熟练度</th>
                    </tr>
                    <tr>
                        <td>HTML5</td>
                        <td>精通</td>
                    </tr>
                </table>
                <p class="displaytest">
                    这是隐藏测试文本
                </p>
            </article>
        </main>
        <footer>
            <p>© 2026 张三的个人博客. 版权所有.</p>
        </footer>
    </body>
</html>
